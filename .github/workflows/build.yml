name: OpenWrt Build CI

on:
  workflow_call:
    secrets:
      apk_signing_key:
        required: true
      apk_signing_pubkey:
        required: true
    inputs:
      ref:
        required: true
        type: string

jobs:
  build:
    name: Build x86_64 OpenWrt Firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024
          
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: "false"
          android: "true"
          dotnet: "true"
          haskell: "true"
          large-packages: "true"
          docker-images: "true"
          swap-storage: "true"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd yasm

      - name: Show System Info
        run: |
          echo "==================== System Info ===================="
          uname -a
          echo ""
          echo "==================== CPU Info ===================="
          echo "Physical CPUs: $(cat /proc/cpuinfo | grep 'physical id' | sort -u | wc -l)"
          echo "CPU Cores: $(nproc)"
          echo "CPU Model: $(cat /proc/cpuinfo | grep -m1 'model name' | cut -d: -f2 | xargs)"
          echo ""
          echo "==================== Memory Info ===================="
          free -h
          echo ""
          echo "==================== Disk Info ===================="
          df -hT

      - name: Update feeds
        run: ./tool.sh feed

      - name: Generate build configuration
        run: |
          set -euo pipefail
          rm -f .config .config.old
          cp configs/full_musl_config .config
          mkdir -p .ccache

          echo 'CONFIG_DEVEL=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          echo "CONFIG_CCACHE_DIR=/home/runner/work/immortalwrt/immortalwrt/.ccache" >> .config

          
          ccache --max-size 5G
          ccache --set-config cache_dir=/home/runner/work/immortalwrt/immortalwrt/.ccache
          ccache --set-config compression=true
          ccache --set-config compression_level=3

          make defconfig

      - name: Download build packages
        run: |
          make download -j8
          df -h  

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/work/immortalwrt/immortalwrt/.ccache
          key: openwrt-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            openwrt-ccache-${{ runner.os }}-
            ccache-${{ runner.os }}-musl-full-

      - name: Restore APK signing key
        run: |
          mkdir -p keys
          echo "${{ secrets.apk_signing_key }}" > \
            keys/coolkidwrt-snapshots.pem
          chmod 600 keys/coolkidwrt-snapshots.pem
          echo "${{ secrets.apk_signing_pubkey }}" > \
            keys/coolkidwrt-snapshots.pem.pub
          chmod 600 keys/coolkidwrt-snapshots.pem.pub
                
      - name: Compile firmware
        run: |
          make \
            BUILD_KEY_APK_SEC="${{ github.workspace }}/keys/coolkidwrt-snapshots.pem" \
            BUILD_KEY_APK_PUB="${{ github.workspace }}/keys/coolkidwrt-snapshots.pem.pub" \
            -j$(nproc) || make -j1 V=s

      - name: Save ccache
        uses: actions/cache/save@v5
        with:
          path: /home/runner/work/immortalwrt/immortalwrt/.ccache
          key: openwrt-ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Show ccache statistics
        run: |
          ccache -s -v

      - name: Prepare firmware artifacts
        run: |
          set -euo pipefail
          mkdir -p artifact/firmware artifact/buildinfo
          find bin/targets -type f -name 'immortalwrt-*' ! -name '*.manifest' \
            -exec cp -t artifact/firmware {} +
          find bin/targets -type f -name sha256sums \
            -exec cp -t artifact/firmware {} +
          find bin/targets -type f \( -name '*.buildinfo' -o -name '*.manifest' \) \
            -exec cp -t artifact/buildinfo {} +

      - name: Prepare APK repository
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          PAGES_DIR="${RUNNER_TEMP}/apk-repository"
          mkdir -p \
            "$PAGES_DIR/targets/x86/64" \
            "$PAGES_DIR/packages"

          cp -a bin/targets/x86/64/packages "$PAGES_DIR/targets/x86/64/"
          cp -a bin/packages/x86_64 "$PAGES_DIR/packages/"
          
          while IFS= read -r index; do
            printf '%s/%s\n' "${PAGES_URL%/}" "$index"
          done < <(find "$PAGES_DIR" -type f -name packages.adb -printf '%P\n' | sort) \
            > "$PAGES_DIR/repositories.list"

          {
            printf '%s\n' '<!doctype html>' '<meta charset="utf-8">'
            printf '%s\n' '<title>ImmortalWrt APK Repository</title>' '<h1>ImmortalWrt APK Repository</h1>'
            printf '%s\n' '<p><a href="repositories.list">repositories.list</a></p>' '<ul>'
            while IFS= read -r url; do
              printf '<li><a href="%s"><code>%s</code></a></li>\n' "$url" "$url"
            done < "$PAGES_DIR/repositories.list"
            printf '%s\n' '</ul>'
          } > "$PAGES_DIR/index.html"

      - name: Upload build information
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-buildinfo
          path: artifact/buildinfo/
          if-no-files-found: error

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-firmware
          path: artifact/firmware/
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/apk-repository

  deploy_pages:
    name: Deploy APK repository to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
